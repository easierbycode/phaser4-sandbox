name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download example assets from CDN
        run: |
          set -e
          mkdir -p assets/animations assets/skies
          BASE="https://cdn.phaserfiles.com/v385"
          curl -fL -o assets/animations/walker.png  "$BASE/assets/animations/walker.png"
          curl -fL -o assets/animations/walker.json "$BASE/assets/animations/walker.json"
          curl -fL -o assets/skies/ms3-sky.png      "$BASE/assets/skies/ms3-sky.png"
          curl -fL -o assets/skies/ms3-trees.png    "$BASE/assets/skies/ms3-trees.png"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
